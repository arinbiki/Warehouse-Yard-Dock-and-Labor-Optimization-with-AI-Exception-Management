app:
  description: 'AI Shift Planning Recommendation Generator synthesizing workload forecasts, skill gaps, and fatigue constraints'
  icon: 👥
  icon_background: '#8B5CF6'
  mode: workflow
  name: 05 - Shift Planning Recommendation Generator
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
  graph:
    edges:
      - id: edge_start_to_llm
        source: start_node
        target: llm_shift_planner
      - id: edge_llm_to_end
        source: llm_shift_planner
        target: end_node
    nodes:
      - id: start_node
        data:
          title: Start
          type: start
          variables:
            - label: forecast_json
              max_length: 5000
              required: true
              type: paragraph
              variable: forecast_json
        position:
          x: 100
          y: 200
      - id: llm_shift_planner
        data:
          title: Shift Planner
          type: llm
          model:
            provider: ollama
            name: qwen2.5:3b
            mode: chat
            completion_params:
              temperature: 0.2
          prompt_template:
            - role: system
              text: |
                You are a Warehouse Workforce Management & Shift Planning Specialist.
                Evaluate the shift forecast, headcounts, pick rates, and skill requirements.
                Recommend:
                1) Shift balance adjustments
                2) Overtime authorizations with financial cost calculations
                3) Cross-training recommendations
                4) Fatigue mitigation protocols
            - role: user
              text: |
                Forecast Data:
                {{#start_node.forecast_json#}}
          output_key: recommendations
        position:
          x: 400
          y: 200
      - id: end_node
        data:
          title: End
          type: end
          outputs:
            - value_selector:
                - llm_shift_planner
                - recommendations
              variable: recommendations
        position:
          x: 700
          y: 200
